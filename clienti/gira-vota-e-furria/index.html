    :root{
      --bg:#f7f3ec;--card:#ffffff;--gold:#d9981e;--gold2:#c88916;
      --muted:#7b746a;--line:#e5ddd2;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{background:var(--bg);font-family:"Jost",sans-serif;color:#222;max-width:680px;margin:0 auto;overflow-x:hidden}

    /* LANG BAR */
    .lang-bar{display:flex;justify-content:flex-end;gap:6px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
    .lang-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;font-family:"Jost",sans-serif;cursor:pointer;transition:all .2s;font-weight:600}
    .lang-btn:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
    .lang-btn.on{background:var(--gold);color:#fff;border-color:var(--gold)}

    /* HERO */
    .hero{padding:32px 24px 28px;text-align:center;background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.96)),var(--bg);border-bottom:1px solid var(--line)}
    .logo{width:300px;max-width:100%;margin:0 auto 16px;display:block}
    .badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#fff;border-radius:999px;padding:9px 16px;font-size:12px;letter-spacing:.08em;margin-bottom:16px}
    .dot{width:7px;height:7px;border-radius:50%;background:#f6c453}
    .hero p{color:var(--muted);line-height:1.6;font-size:14px}

    /* MENU */
    .menu{padding:18px}
    .categoria{margin-bottom:14px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.03)}
    .cat-header{display:flex;justify-content:space-between;align-items:center;padding:20px;cursor:pointer}
    .cat-left{display:flex;gap:14px;align-items:flex-start}
    .emoji{font-size:26px;line-height:1}
    .cat-title{font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--gold2);line-height:1;margin-bottom:4px}
    .cat-sub{color:var(--muted);font-size:13px}
    .toggle{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);transition:.2s;flex-shrink:0}
    .categoria.active .toggle{transform:rotate(45deg);background:var(--gold);color:#fff;border-color:var(--gold)}
    .cat-body{display:none;border-top:1px solid var(--line)}
    .categoria.active .cat-body{display:block}

    /* PIATTI */
    .piatto{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .piatto:last-child{border-bottom:none}
    .nome{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.1;margin-bottom:5px;color:#222}
    .desc{color:var(--muted);font-size:13px;line-height:1.5}
    .prezzo{color:var(--gold);font-weight:600;font-size:17px;white-space:nowrap;flex-shrink:0}

    .footer-note{margin:20px 18px;background:#efe7da;border:1px solid #e2d5c0;border-radius:18px;padding:16px;color:#5f564a;font-size:13px;line-height:1.6}
    .footer{padding:24px 20px 14px;text-align:center;color:#888;font-size:12px}
    .visit-counter{padding:0 20px 36px;text-align:center;color:#9a9186;font-size:12px}
    .visit-counter strong{color:var(--gold2);font-weight:600}
  </style>
</head>

let lang = "it";
let openCats = new Set([0]); // Prima categoria aperta di default

function buildLangBar(){
  const bar = document.getElementById("lang-bar");
  bar.innerHTML = "";
  [["it","it"],["en","gb"],["de","de"],["fr","fr"]].forEach(([l,code])=>{
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (l===lang?" on":"");
    btn.innerHTML = "<img src='https://flagcdn.com/20x15/"+code+".png' style='width:22px;height:16px;border-radius:2px;vertical-align:middle'>";
    btn.onclick = () => { lang = l; render(); };
    bar.appendChild(btn);
  });
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("badge-text").textContent = t.badge;
  document.getElementById("hero-desc").textContent = t.hero;
  document.getElementById("footer-note").textContent = t.footerNote;
  buildLangBar();

  const menu = document.getElementById("menu-section");
  menu.innerHTML = "";
  t.cats.forEach((cat, idx)=>{
    const isOpen = openCats.has(idx);
    const dishesHtml = cat.dishes.map(d=>`
      <div class="piatto">
        <div>
          <div class="nome">${d.n}</div>
          ${d.d ? `<div class="desc">${d.d}</div>` : ""}
        </div>
        <div class="prezzo">${d.p}</div>
      </div>
    `).join("");

    const div = document.createElement("div");
    div.className = "categoria" + (isOpen?" active":"");
    div.innerHTML = `
      <div class="cat-header" onclick="toggleCat(this,${idx})">
        <div class="cat-left">
          <div class="emoji">${cat.ico}</div>
          <div>
            <div class="cat-title">${cat.title}</div>
            <div class="cat-sub">${cat.sub}</div>
          </div>
        </div>
        <div class="toggle">+</div>
      </div>
      <div class="cat-body">${dishesHtml}</div>
    `;
    menu.appendChild(div);
  });
}

function toggleCat(el, idx){
  const cat = el.parentElement;
  cat.classList.toggle("active");
  if(cat.classList.contains("active")) openCats.add(idx);
  else openCats.delete(idx);
}


function initVisitCounter(){
  const el = document.getElementById("visit-count");
  if(!el) return;

  const key = "menoova_visite_gira_vota_e_furria";
  const current = parseInt(localStorage.getItem(key) || "0", 10);
  const next = current + 1;

  localStorage.setItem(key, String(next));
  el.textContent = next.toLocaleString("it-IT");
}

render();
initVisitCounter();
