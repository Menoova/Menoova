const FLAGS=[["it","it"],["en","gb"],["de","de"],["fr","fr"]];
let lang="it", activeFilters=new Set();

function flagBtn(l,code,targetId){
  const btn=document.createElement("button");
  btn.className=(l===lang?"on":"");
  btn.innerHTML=`<img src="https://flagcdn.com/20x15/${code}.png" alt="${l.toUpperCase()}" style="width:22px;height:16px;border-radius:2px;display:block">`;
  btn.onclick=()=>setLang(l);
  return btn;
}

function buildLangBtns(){
  ["welcome-lang","header-lang"].forEach(id=>{
    const wrap=document.getElementById(id); wrap.innerHTML="";
    FLAGS.forEach(([l,code])=>wrap.appendChild(flagBtn(l,code,id)));
  });
}

function renderWelcome(){
  const w=WELCOME[lang];
  document.getElementById("w-tagline").textContent=w.tagline;
  document.getElementById("w-text").textContent=w.text;
  document.getElementById("w-cta-label").textContent=w.cta;
}

function tags(allergens){return allergens.map(a=>`<span class="a-tag">${ALLERGENS[a][lang]}</span>`).join("")}
function blocked(a){return a.some(x=>activeFilters.has(x))}

function render(){
  const t=I18N[lang];
  const content=document.getElementById("content"); content.innerHTML="";
  t.tabs.forEach((tab,idx)=>{
    const data=DATA[tab.id];
    let html=`<section class="menu-section" id="sec-${tab.id}">`;
    html+=`<div class="sec-hdr"><h2><span style="font-size:17px">${tab.ico}</span> ${tab.name}</h2><p>${tab.sub}</p></div>`;
    if(data.featured){
      const f=data.featured; const isBlocked=blocked(f.a);
      html+=`<div class="dish-featured ${f.img?'with-photo':''}" ${isBlocked?'style="display:none"':''}>
        ${f.img?`<div class="feat-img" style="background-image:url('${f.img}')"></div><div class="df-content">`:''}
        <div class="df-badge">${t.sigBadge}</div>
        <div class="df-name">${f.n[lang]}</div>
        <div class="df-desc">${f.d[lang]}</div>
        <div class="df-bottom"><div class="df-price">€ ${f.p}</div><div class="df-tags">${tags(f.a)}</div></div>
        ${f.img?'</div>':''}
      </div>`;
    }
    if(data.bar){
      const vis=data.bar.filter(b=>!blocked(b.a));
      if(vis.length){
        html+=`<div class="bar-wrap"><div class="bar-table">
          <div class="bar-hdr"><span>Crudi al Pezzo</span><span style="opacity:.7;font-weight:400">Nudi e crudi, pescati e mangiati</span></div>
          ${vis.map(b=>`<div class="bar-row"><span class="bn">${b.n[lang]}</span><span class="bp">${b.p}</span></div>`).join("")}
        </div></div>`;
      }
    }
    if(data.dishes?.length){
      html+=`<div class="dish-list">`;
      data.dishes.forEach(d=>{
        if(d.divider){
          html+=`</div><div class="sub-hdr"><span>${d.divider[lang]}</span></div><div class="dish-list">`;
          return;
        }
        const isBlocked=blocked(d.a);
        html+=`<div class="dish-row${isBlocked?" hidden":""}${d.img?" has-photo":""}">
          <div class="dr-left">
            <div class="dr-name">${d.n[lang]}</div>
            <div class="dr-desc">${d.d[lang]}</div>
            ${d.a.length?`<div class="dr-tags">${tags(d.a)}</div>`:""}
          </div>
          ${d.img
            ?`<div class="dr-photo-wrap"><img src="${d.img}" class="dr-photo" loading="lazy" alt="${d.n[lang]}"><div class="dr-price">€ ${d.p}</div></div>`
            :`<div class="dr-price">€ ${d.p}</div>`
          }
        </div>`;
      });
      html+=`</div>`;
    }
    if(data.contorni){
      html+=`<div class="cont-hdr"><p>Contorni</p></div>`;
      html+=`<div class="cont-grid">${data.contorni.map(c=>`<div class="cont-card"><div class="cont-name">${c.n[lang]}</div><div class="cont-desc">${c.d[lang]}</div><div class="cont-price">€ ${c.p}</div></div>`).join("")}</div>`;
    }
    if(idx<t.tabs.length-1)html+=`<div class="sec-divider"></div>`;
    html+=`</section>`;
    content.innerHTML+=html;
  });
}

function buildChips(){
  const wrap=document.getElementById("chips"); wrap.innerHTML="";
  Object.keys(ALLERGENS).forEach(k=>{
    const b=document.createElement("button"); b.className="chip"+(activeFilters.has(k)?" active":"");
    b.innerHTML=ALLERGENS[k][lang]+(activeFilters.has(k)?'<span style="font-size:10px;opacity:.7"> ✕</span>':"");
    b.onclick=()=>{activeFilters.has(k)?activeFilters.delete(k):activeFilters.add(k);buildChips();render();updateFilterBtn()};
    wrap.appendChild(b);
  });
}

function updateFilterBtn(){
  const btn=document.getElementById("filter-btn");
  btn.classList.toggle("active",activeFilters.size>0);
  btn.innerHTML=`🛡 ${activeFilters.size>0?activeFilters.size+" attivi":I18N[lang].filterLabel}`;
}

function toggleFilter(){document.getElementById("filter-panel").classList.toggle("open")}

function setLang(l){
  lang=l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");if(I18N[l][k])el.innerHTML=I18N[l][k]});
  buildLangBtns(); renderWelcome(); buildChips(); render(); updateFilterBtn();
}

buildLangBtns(); renderWelcome(); buildChips(); render();
</script>
</body>
</html>
