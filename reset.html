<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimposta password — InvoiceIQ</title>
<style>
  :root { --bg:#0e0f17; --card:#1c1f2b; --ink:#f3f3f8; --muted:#a6a4c2; --accent:#6754e8; --line:rgba(255,255,255,.08); --bad:#ff6b6b; --ok:#37d39b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card {
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .logo { width:54px; height:54px; border-radius:14px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; margin:0 auto 16px; }
  h1 { font-size:1.3rem; text-align:center; margin:0 0 6px; }
  p.sub { text-align:center; color:var(--muted); font-size:.92rem; margin:0 0 22px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:14px 0 6px; }
  input {
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#13151f; color:var(--ink); font-size:1rem; outline:none;
  }
  input:focus { border-color:var(--accent); }
  button {
    width:100%; margin-top:20px; padding:13px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:16px; font-size:.9rem; text-align:center; }
  .msg.bad { color:var(--bad); }
  .msg.ok { color:var(--ok); }
  .hidden { display:none; }
  .foot { text-align:center; color:var(--muted); font-size:.78rem; margin-top:20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">IQ</div>
    <h1>Reimposta la password</h1>
    <p class="sub">Inserisci la tua nuova password per InvoiceIQ.</p>

    <div id="loading" class="msg">Verifica del link in corso…</div>

    <form id="form" class="hidden" onsubmit="return false">
      <label for="pw">Nuova password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="Almeno 6 caratteri" />
      <label for="pw2">Conferma password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Ripeti la password" />
      <button id="submit" type="submit">Aggiorna password</button>
    </form>

    <div id="message" class="msg"></div>

    <div class="foot">InvoiceIQ by menoova.it</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Valori pubblici del progetto Supabase (la chiave publishable è pensata per stare nel client).
    const SUPABASE_URL = "https://ymaojnzqrlnvubfptbuw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pSHgthK8ivUNu1QTe19G9w_4_DtD0pg";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: false }
    });

    const $ = (id) => document.getElementById(id);
    const loading = $("loading"), form = $("form"), message = $("message");

    function showForm() {
      loading.classList.add("hidden");
      form.classList.remove("hidden");
    }
    function fail(text) {
      loading.classList.add("hidden");
      form.classList.add("hidden");
      message.className = "msg bad";
      message.textContent = text;
    }

    // Verifica se il link contiene un errore (es. scaduto)
    function hashHasError() {
      const h = window.location.hash || "";
      return h.includes("error") || h.includes("otp_expired");
    }

    async function init() {
      if (hashHasError()) {
        fail("Il link di recupero non è valido o è scaduto. Richiedi un nuovo reset dall'app.");
        return;
      }

      // Flusso PKCE moderno: ?code=...
      const params = new URLSearchParams(window.location.search);
      if (params.get("code")) {
        try { await sb.auth.exchangeCodeForSession(window.location.href); } catch (_) {}
      }

      // Attendi che la sessione di recupero sia disponibile
      let tries = 0;
      const check = async () => {
        const { data } = await sb.auth.getSession();
        if (data && data.session) { showForm(); return; }
        if (++tries < 12) { setTimeout(check, 350); return; }
        fail("Link non valido o scaduto. Apri di nuovo l'email di recupero o richiedi un nuovo reset dall'app.");
      };
      check();
    }

    sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") showForm();
    });

    $("submit").addEventListener("click", async () => {
      const pw = $("pw").value, pw2 = $("pw2").value;
      message.className = "msg";
      message.textContent = "";

      if (pw.length < 6) { message.className = "msg bad"; message.textContent = "La password deve avere almeno 6 caratteri."; return; }
      if (pw !== pw2) { message.className = "msg bad"; message.textContent = "Le due password non coincidono."; return; }

      $("submit").disabled = true;
      $("submit").textContent = "Aggiorno…";
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        message.className = "msg bad";
        message.textContent = "Errore: " + (error.message || "riprova.");
        $("submit").disabled = false;
        $("submit").textContent = "Aggiorna password";
        return;
      }
      try { await sb.auth.signOut(); } catch (_) {}
      form.classList.add("hidden");
      message.className = "msg ok";
      message.textContent = "✓ Password aggiornata. Ora torna nell'app InvoiceIQ e accedi con la nuova password.";
    });

    init();
  </script>
</body>
</html>
