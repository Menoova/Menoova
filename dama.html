<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dama · contro l'AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14201c;
    --panel:#1b2925;
    --panel-2:#213330;
    --sq-dark:#24463a;
    --sq-light:#e7d9b8;
    --frame-a:#3a2a1a;
    --frame-b:#241811;
    --brass:#c6a15b;
    --brass-dim:#8f7538;
    --ivory:#f2e8cf;
    --ivory-rim:#c9b184;
    --ox:#8f322b;
    --ox-rim:#5f1e19;
    --text:#ece3d0;
    --muted:#93a29a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1f302b 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:560px}

  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(34px,9vw,52px);
    letter-spacing:-.02em;
    line-height:.9;
    color:var(--ivory);
  }
  .title .dot{color:var(--brass)}
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);text-align:right;
  }

  /* status bar */
  .status{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid rgba(198,161,91,.18);
    border-radius:12px;
    padding:12px 16px;margin-bottom:16px;
    min-height:56px;
  }
  .turn-badge{
    width:22px;height:22px;border-radius:50%;flex:0 0 auto;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 4px rgba(0,0,0,.4);
    transition:transform .3s ease;
  }
  .turn-badge.h{background:radial-gradient(circle at 35% 30%,#fff9ec,var(--ivory) 55%,var(--ivory-rim))}
  .turn-badge.a{background:radial-gradient(circle at 35% 30%,#c0554c,var(--ox) 55%,var(--ox-rim))}
  .status-text{font-size:15px;font-weight:500}
  .status-text .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
  .thinking-dots span{
    display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brass);
    margin-left:3px;animation:blink 1.1s infinite both;
  }
  .thinking-dots span:nth-child(2){animation-delay:.2s}
  .thinking-dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

  /* board */
  .board-frame{
    position:relative;
    padding:16px;
    border-radius:14px;
    background:
      linear-gradient(135deg,var(--frame-a),var(--frame-b));
    box-shadow:
      0 1px 0 rgba(198,161,91,.35) inset,
      0 0 0 1px rgba(0,0,0,.5),
      0 24px 48px -18px rgba(0,0,0,.8);
  }
  .board-frame::after{
    content:"";position:absolute;inset:10px;border-radius:8px;
    border:1px solid rgba(198,161,91,.4);pointer-events:none;
  }
  .board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    aspect-ratio:1/1;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 0 0 2px rgba(0,0,0,.55);
    touch-action:manipulation;
  }
  .sq{position:relative;display:flex;align-items:center;justify-content:center}
  .sq.light{background:
      linear-gradient(180deg,rgba(255,255,255,.06),transparent),
      var(--sq-light)}
  .sq.dark{background:
      linear-gradient(180deg,rgba(255,255,255,.04),transparent),
      var(--sq-dark)}
  .sq.dark.playable{cursor:default}
  .sq.last{box-shadow:inset 0 0 0 3px rgba(198,161,91,.75)}
  .sq.selectable{cursor:pointer}
  .sq.selectable::before{
    content:"";position:absolute;inset:6%;border-radius:8px;
    box-shadow:inset 0 0 0 2px rgba(198,161,91,.55);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .sq.selected::before{
    content:"";position:absolute;inset:4%;border-radius:9px;
    box-shadow:inset 0 0 0 3px var(--brass);opacity:1;animation:none;
  }
  .hint{
    position:absolute;width:26%;height:26%;border-radius:50%;
    background:radial-gradient(circle,rgba(198,161,91,.9),rgba(198,161,91,.35));
    cursor:pointer;animation:pop .25s ease both;
  }
  .hint.capture{
    width:74%;height:74%;background:none;border-radius:12px;
    box-shadow:inset 0 0 0 3px rgba(198,161,91,.9);
  }
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  /* pieces */
  .piece{
    position:absolute;width:76%;height:76%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s;
    animation:place .22s ease both;
  }
  @keyframes place{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .piece.h{
    background:radial-gradient(circle at 34% 28%,#fffaef 0%,var(--ivory) 52%,var(--ivory-rim) 100%);
    box-shadow:
      inset 0 3px 5px rgba(255,255,255,.7),
      inset 0 -6px 8px rgba(120,95,50,.5),
      0 4px 7px rgba(0,0,0,.45);
  }
  .piece.a{
    background:radial-gradient(circle at 34% 28%,#c85f52 0%,var(--ox) 52%,var(--ox-rim) 100%);
    box-shadow:
      inset 0 3px 5px rgba(255,255,255,.28),
      inset 0 -6px 8px rgba(0,0,0,.5),
      0 4px 7px rgba(0,0,0,.5);
  }
  .piece .ring{
    position:absolute;inset:14%;border-radius:50%;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .piece.a .ring{box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
  .crown{
    font-size:min(4.2vw,22px);line-height:1;color:var(--brass);
    text-shadow:0 1px 1px rgba(0,0,0,.5);
    filter:drop-shadow(0 0 2px rgba(198,161,91,.5));
  }

  /* controls */
  .panel{
    margin-top:16px;background:var(--panel);
    border:1px solid rgba(198,161,91,.14);border-radius:12px;padding:14px 16px;
  }
  .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .score{display:flex;align-items:center;gap:9px}
  .score .chip{width:16px;height:16px;border-radius:50%}
  .score .chip.h{background:radial-gradient(circle at 35% 30%,#fff9ec,var(--ivory) 60%,var(--ivory-rim))}
  .score .chip.a{background:radial-gradient(circle at 35% 30%,#c0554c,var(--ox) 60%,var(--ox-rim))}
  .score .num{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1}
  .score .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .vs{font-family:'Fraunces',serif;color:var(--brass);font-size:15px;font-style:italic}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .seg{display:flex;background:var(--bg);border:1px solid rgba(198,161,91,.16);border-radius:9px;overflow:hidden}
  .seg button{
    font-family:inherit;font-size:13px;color:var(--muted);
    background:none;border:none;padding:8px 12px;cursor:pointer;transition:.15s;
  }
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--brass);color:#1b120a;font-weight:600}
  .seg-label{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;width:100%;margin-bottom:-2px}
  .newgame{
    margin-left:auto;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    color:#1b120a;background:linear-gradient(180deg,#e0bd73,var(--brass));
    border:none;border-radius:9px;padding:10px 18px;
    box-shadow:0 3px 0 var(--brass-dim);transition:.12s;
  }
  .newgame:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-dim)}

  /* overlay */
  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,16,14,.72);backdrop-filter:blur(3px);border-radius:5px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .result-card{text-align:center;padding:8px 24px}
  .result-card h2{font-family:'Fraunces',serif;font-size:clamp(30px,8vw,46px);font-weight:900;margin-bottom:6px}
  .result-card h2.win{color:var(--brass)}
  .result-card h2.lose{color:var(--ox)}
  .result-card h2.draw{color:var(--text)}
  .result-card p{color:var(--muted);font-size:14px}

  .foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.5;text-align:center}
  .foot b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="title">Dama<span class="dot">.</span></h1>
    <div class="kicker">Tu vs Intelligenza Artificiale</div>
  </header>

  <div class="status">
    <div id="turnBadge" class="turn-badge h"></div>
    <div class="status-text">
      <span id="statusMain">Tocca a te</span>
      <span class="sub" id="statusSub">Muovi in diagonale. Le catture sono obbligatorie.</span>
    </div>
  </div>

  <div class="board-frame">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="score-row">
      <div class="score"><span class="chip h"></span><span class="num" id="scoreH">12</span><span class="lbl">le tue</span></div>
      <span class="vs">contro</span>
      <div class="score"><span class="lbl">AI</span><span class="num" id="scoreA">12</span><span class="chip a"></span></div>
    </div>
    <div class="controls">
      <span class="seg-label">Difficoltà</span>
      <div class="seg" id="diffSeg">
        <button data-d="facile">Facile</button>
        <button data-d="medio" class="on">Medio</button>
        <button data-d="difficile">Difficile</button>
      </div>
      <div class="seg" id="firstSeg">
        <button data-f="h" class="on">Inizi tu</button>
        <button data-f="a">Inizia l'AI</button>
      </div>
      <button class="newgame" id="newGameBtn">Nuova partita</button>
    </div>
  </div>

  <p class="foot">
    Le tue pedine sono <b>avorio</b> e muovono verso l'alto; l'AI gioca <b>rosso</b>.
    Arriva in fondo per promuovere una pedina a <b>Dama</b> (♛), che muove e cattura in ogni direzione.
  </p>
</div>

<script>
// ================= CORE LOGIC (verified) =================
const N=8;
const inB=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
const clone=b=>b.map(row=>row.map(cell=>cell?{p:cell.p,k:cell.k}:null));
const ALL=[[-1,-1],[-1,1],[1,-1],[1,1]];
const manDirs=p=>p==='h'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
const promotes=(p,r)=>(p==='h'&&r===0)||(p==='a'&&r===7);

function initialBoard(){
  const b=Array.from({length:N},()=>Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if((r+c)%2===1){
    if(r<=2)b[r][c]={p:'a',k:false};
    else if(r>=5)b[r][c]={p:'h',k:false};
  }
  return b;
}
function captureSeqs(board,r,c){
  const piece=board[r][c];
  const dirs=piece.k?ALL:manDirs(piece.p);
  const enemy=piece.p==='h'?'a':'h';
  const out=[];
  for(const [dr,dc] of dirs){
    const mr=r+dr,mc=c+dc,jr=r+2*dr,jc=c+2*dc;
    if(!inB(jr,jc))continue;
    if(!board[mr][mc]||board[mr][mc].p!==enemy)continue;
    if(board[jr][jc])continue;
    const nb=clone(board);
    nb[r][c]=null;nb[mr][mc]=null;
    let np={p:piece.p,k:piece.k},became=false;
    if(!np.k&&promotes(np.p,jr)){np.k=true;became=true;}
    nb[jr][jc]=np;
    const subs=became?[]:captureSeqs(nb,jr,jc);
    if(subs.length===0){
      out.push({path:[[r,c],[jr,jc]],captures:[[mr,mc]],board:nb});
    }else{
      for(const s of subs)out.push({path:[[r,c],...s.path.slice(1)],captures:[[mr,mc],...s.captures],board:s.board});
    }
  }
  return out;
}
function simpleMoves(board,r,c){
  const piece=board[r][c];
  const dirs=piece.k?ALL:manDirs(piece.p);
  const out=[];
  for(const [dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(!inB(nr,nc)||board[nr][nc])continue;
    const nb=clone(board);nb[r][c]=null;
    let np={p:piece.p,k:piece.k};
    if(!np.k&&promotes(np.p,nr))np.k=true;
    nb[nr][nc]=np;
    out.push({path:[[r,c],[nr,nc]],captures:[],board:nb});
  }
  return out;
}
function getAllMoves(board,player){
  const caps=[],simples=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const pc=board[r][c];if(!pc||pc.p!==player)continue;
    const cs=captureSeqs(board,r,c);
    if(cs.length)for(const m of cs)caps.push({from:[r,c],...m});
    else for(const m of simpleMoves(board,r,c))simples.push({from:[r,c],...m});
  }
  return caps.length?caps:simples;
}
function countPieces(board){let h=0,a=0;for(const row of board)for(const cell of row)if(cell)(cell.p==='h'?h++:a++);return{h,a};}

// ================= AI (minimax + alpha-beta) =================
const MAN=100,KING=175;
function evaluate(board){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const pc=board[r][c];if(!pc)continue;
    let v=pc.k?KING:MAN,pos=0;
    if(!pc.k)pos+=(pc.p==='a'?r:(7-r))*6;
    if(pc.p==='a'&&r===0)pos+=12;
    if(pc.p==='h'&&r===7)pos+=12;
    if(pc.k)pos+=6;
    if(c>=2&&c<=5)pos+=2;
    s+=(pc.p==='a'?1:-1)*(v+pos);
  }
  return s;
}
function minimax(board,depth,alpha,beta,ai){
  const moves=getAllMoves(board,ai?'a':'h');
  if(moves.length===0)return ai?-100000-depth:100000+depth;
  if(depth===0)return evaluate(board);
  if(ai){let best=-Infinity;for(const m of moves){best=Math.max(best,minimax(m.board,depth-1,alpha,beta,false));alpha=Math.max(alpha,best);if(beta<=alpha)break;}return best;}
  else{let best=Infinity;for(const m of moves){best=Math.min(best,minimax(m.board,depth-1,alpha,beta,true));beta=Math.min(beta,best);if(beta<=alpha)break;}return best;}
}
function chooseAiMove(board,depth,noise){
  const moves=getAllMoves(board,'a');
  const scored=moves.map(m=>({m,v:minimax(m.board,depth-1,-Infinity,Infinity,false)}));
  const best=Math.max(...scored.map(x=>x.v));
  const pool=scored.filter(x=>x.v>=best-noise);
  return pool[Math.floor(Math.random()*pool.length)].m;
}

// ================= UI / GAME STATE =================
const DEPTH={facile:2,medio:4,difficile:6};
const NOISE={facile:45,medio:14,difficile:0};
const boardEl=document.getElementById('board');
const state={
  board:initialBoard(),
  turn:'h',
  selected:null,      // [r,c]
  hints:[],           // list of moves for selected piece
  difficulty:'medio',
  firstMover:'h',
  thinking:false,
  over:false,
  lastMove:null,      // {from,to}
};

function currentMovesFor(player){return getAllMoves(state.board,player);}

function render(){
  boardEl.innerHTML='';
  const humanMoves=(!state.over&&state.turn==='h'&&!state.thinking)?currentMovesFor('h'):[];
  const selectableSet=new Set(humanMoves.map(m=>m.from[0]*8+m.from[1]));

  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const sq=document.createElement('div');
    const dark=(r+c)%2===1;
    sq.className='sq '+(dark?'dark playable':'light');
    sq.dataset.r=r;sq.dataset.c=c;

    if(state.lastMove){
      const {from,to}=state.lastMove;
      if((from[0]===r&&from[1]===c)||(to[0]===r&&to[1]===c))sq.classList.add('last');
    }
    const key=r*8+c;
    const isSelected=state.selected&&state.selected[0]===r&&state.selected[1]===c;
    if(isSelected)sq.classList.add('selected');
    else if(selectableSet.has(key)&&!state.selected)sq.classList.add('selectable');

    const pc=state.board[r][c];
    if(pc){
      const p=document.createElement('div');
      p.className='piece '+pc.p;
      p.innerHTML='<div class="ring"></div>'+(pc.k?'<div class="crown">♛</div>':'');
      sq.appendChild(p);
    }
    boardEl.appendChild(sq);
  }

  // hints for selected piece
  if(state.selected&&!state.thinking&&!state.over){
    for(const m of state.hints){
      const [tr,tc]=m.path[m.path.length-1];
      const sq=boardEl.children[tr*8+tc];
      const h=document.createElement('div');
      h.className='hint'+(m.captures.length?' capture':'');
      h.dataset.dest=tr*8+tc;
      sq.appendChild(h);
    }
  }
  updateStatus();
  const {h,a}=countPieces(state.board);
  document.getElementById('scoreH').textContent=h;
  document.getElementById('scoreA').textContent=a;
}

function updateStatus(){
  const badge=document.getElementById('turnBadge');
  const main=document.getElementById('statusMain');
  const sub=document.getElementById('statusSub');
  if(state.over)return;
  badge.className='turn-badge '+state.turn;
  if(state.turn==='h'){
    main.textContent='Tocca a te';
    const caps=currentMovesFor('h').some(m=>m.captures.length);
    sub.textContent=caps?'Cattura disponibile: sei obbligato a mangiare.':'Seleziona una pedina evidenziata.';
  }else{
    main.innerHTML='L\u2019AI sta pensando<span class="thinking-dots"><span></span><span></span><span></span></span>';
    sub.textContent='Livello '+state.difficulty;
  }
}

function onBoardClick(e){
  if(state.over||state.thinking||state.turn!=='h')return;
  const hint=e.target.closest('.hint');
  if(hint){
    const dest=+hint.dataset.dest;
    const move=state.hints.find(m=>{const t=m.path[m.path.length-1];return t[0]*8+t[1]===dest;});
    if(move){applyHumanMove(move);return;}
  }
  const sq=e.target.closest('.sq');
  if(!sq)return;
  const r=+sq.dataset.r,c=+sq.dataset.c;
  const pc=state.board[r][c];
  if(pc&&pc.p==='h'){
    const moves=currentMovesFor('h').filter(m=>m.from[0]===r&&m.from[1]===c);
    if(moves.length){state.selected=[r,c];state.hints=moves;render();return;}
  }
  // clicked elsewhere -> deselect
  state.selected=null;state.hints=[];render();
}

function applyHumanMove(move){
  state.board=move.board;
  state.lastMove={from:move.from,to:move.path[move.path.length-1]};
  state.selected=null;state.hints=[];
  state.turn='a';
  render();
  if(checkGameOver())return;
  state.thinking=true;
  updateStatus();
  setTimeout(aiTurn,420);
}

function aiTurn(){
  const move=chooseAiMove(state.board,DEPTH[state.difficulty],NOISE[state.difficulty]);
  state.board=move.board;
  state.lastMove={from:move.from,to:move.path[move.path.length-1]};
  state.thinking=false;
  state.turn='h';
  render();
  checkGameOver();
}

function checkGameOver(){
  const {h,a}=countPieces(state.board);
  let over=false,youWin=false,draw=false;
  if(a===0){over=true;youWin=true;}
  else if(h===0){over=true;youWin=false;}
  else{
    const moves=currentMovesFor(state.turn);
    if(moves.length===0){over=true;youWin=(state.turn==='a');}
  }
  if(over){
    state.over=true;state.thinking=false;
    showResult(youWin?'win':'lose');
  }
  return over;
}

function showResult(kind){
  const ov=document.getElementById('overlay');
  const t=document.getElementById('resultTitle');
  const p=document.getElementById('resultText');
  if(kind==='win'){t.textContent='Hai vinto';t.className='win';p.textContent='Hai bloccato tutte le pedine dell\u2019AI. Ottima partita.';}
  else if(kind==='lose'){t.textContent='Hai perso';t.className='lose';p.textContent='L\u2019AI ti ha chiuso. Riprova, magari a un livello pi\u00F9 basso.';}
  else{t.textContent='Patta';t.className='draw';p.textContent='Nessun progresso: partita pareggiata.';}
  ov.classList.add('show');
  document.getElementById('statusMain').textContent = kind==='win'?'Vittoria!':kind==='lose'?'Sconfitta':'Patta';
  document.getElementById('statusSub').textContent='Premi "Nuova partita" per rigiocare.';
}

function newGame(){
  document.getElementById('overlay').classList.remove('show');
  state.board=initialBoard();
  state.selected=null;state.hints=[];state.lastMove=null;
  state.over=false;state.thinking=false;
  state.turn=state.firstMover;
  render();
  if(state.turn==='a'){
    state.thinking=true;updateStatus();
    setTimeout(aiTurn,500);
  }
}

// ---- controls ----
boardEl.addEventListener('click',onBoardClick);
document.getElementById('newGameBtn').addEventListener('click',newGame);
document.getElementById('diffSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.difficulty=b.dataset.d;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
});
document.getElementById('firstSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.firstMover=b.dataset.f;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
});

render();
</script>
</body>
</html>
