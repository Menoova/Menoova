<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confermata · MenuIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1ece2;--panel:#fbf8f2;--ink:#20190f;--muted:#7c7264;--gold:#a8782c;--line:rgba(32,25,15,.12);--ok:#23774f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:Inter,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#f6f2e9 0%,var(--bg) 42%)}
  .card{width:100%;max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--line);
    border-radius:22px;padding:34px 26px;box-shadow:0 14px 44px rgba(46,33,12,.08)}
  .logo{font-family:Fraunces,serif;font-weight:700;font-size:30px;letter-spacing:-.5px}
  .logo span{color:var(--gold)}
  .check{width:56px;height:56px;border-radius:50%;background:rgba(35,119,79,.12);color:var(--ok);
    display:flex;align-items:center;justify-content:center;margin:18px auto 6px;font-size:28px}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:21px;margin:8px 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
  .hint{font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Menu<span>IQ</span></div>
    <div class="check">✓</div>
    <h1>Email confermata</h1>
    <p>Il tuo account è attivo. Torna nell'app MenuIQ e accedi con email e password.</p>
    <div class="hint">menoova.it · MenuIQ</div>
  </div>
</body>
</html>
